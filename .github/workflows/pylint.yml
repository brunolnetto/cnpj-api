name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.10"
        enable-cache: true

    - name: Install locked dependencies
      run: uv sync --frozen

    - name: Analysing the code with pylint
      run: uv run --with pylint pylint backend/
