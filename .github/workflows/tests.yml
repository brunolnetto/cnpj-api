name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Settings are validated at import time; tests do not reach a database
    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-not-a-real-password
      POSTGRES_DBNAME_RFB: dadosrfb
      POSTGRES_DBNAME_AUDIT: dadosrfb_analysis
      DEFAULT_RATE_LIMIT: 10/minute
      DEFAULT_BURST_RATE_LIMIT: 500/hour
      JWT_SECRET_KEY: ci-only-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      # Fails if pyproject.toml changed without updating uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest backend/tests -q --cov=backend --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
