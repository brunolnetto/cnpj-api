name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is what the Docker image runs
        python-version: ["3.10", "3.12"]

    # Settings are validated at import time; tests do not reach a database
    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-not-a-real-password
      POSTGRES_DBNAME_RFB: dadosrfb
      POSTGRES_DBNAME_AUDIT: dadosrfb_analysis
      DEFAULT_RATE_LIMIT: 10/minute
      DEFAULT_BURST_RATE_LIMIT: 500/hour
      JWT_SECRET_KEY: ci-only-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Run tests
        run: python -m pytest backend/tests -q --cov=backend --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
