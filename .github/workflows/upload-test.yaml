name: API workflow

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test python API
    steps:
    - uses: actions/checkout@v4

    #----------------------------------------------
    #       Set up Python
    #----------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    #----------------------------------------------
    #       install & configure uv
    #----------------------------------------------
    - name: Install and configure uv
      run: |
        pip install --upgrade pip
        pip install uv

    #----------------------------------------------
    #       install dependencies if cache does not exist
    #----------------------------------------------
    - name: Install dependencies
      run: uv sync --verbose

    #----------------------------------------------
    #       run tests
    #----------------------------------------------
    - name: Run tests
      run: |
        uv run coverage run --rcfile=.coveragerc -m pytest
        uv run coverage report --omit="*/__init__.py,backend/tests/*,backend/app/repositories/cnpj.py,backend/app/database/base.py,backend/app/api/services/scrapper.py" --show-missing

    #----------------------------------------------
    #       Upload coverage reports to Codecov
    #----------------------------------------------
    - name: Upload coverage reports to Codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov -t ${CODECOV_TOKEN}
