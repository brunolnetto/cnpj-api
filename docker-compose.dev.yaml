services:
  backend:
    container_name: cnpj_app
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file: .env.dev
    volumes:
      - .:/app

  db-init:
    image: postgres:14
    env_file: .env.dev
    depends_on:
      - db
    volumes:
      - ./data/sample_data.sql:/data/sample_data.sql
      - ./data/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DBNAME_RFB}
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/init-db.sh"]

  db:
    container_name: cnpj_db
    image: postgres:14
    env_file: .env.dev
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: