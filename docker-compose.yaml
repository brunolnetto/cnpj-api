version: '3.3'

services:
  backend-app:
    ## In development: we use the build context to build the image 
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # ports: 
    #   - "8000:8000"
    image: josezago/cnpj-api
    environment:
      # Traefik reaches the API through the overlay network. uvicorn only reads
      # the client IP from X-Forwarded-For when the request comes from these
      # addresses; otherwise every client looks like Traefik and shares one
      # rate limit quota. Narrow it to the network's subnet:
      #   docker network inspect ConexxoHubNet --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-10.0.0.0/8}"
    networks:
      - ConexxoHubNet
    deploy:
      mode: replicated
      replicas: 10
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend-app.entrypoints=websecure"
        - "traefik.http.routers.backend-app.tls=true" 
        - "traefik.http.routers.backend-app.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.backend-app.rule=Host(`cnpjapi.conexxohub.com.br`)"
        - "traefik.http.services.backend-app.loadbalancer.server.port=8000"
        - "traefik.http.routers.backend-app.service=backend-app"
      

networks:
  ConexxoHubNet:

