[project]
name = "cnpj-api"
version = "0.0.1"
description = "API para consulta de CNPJ"
authors = [{ name = "Bruno Peixoto", email = "brunolnetto@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Exact pins: uv.lock also pins every transitive dependency, and Renovate
# updates both together
dependencies = [
    "APScheduler==4.0.0a6",
    "bs4==0.0.2",
    "fastapi==0.115.12",
    "ipwhois==1.3.0",
    "lxml==5.4.0",
    "nltk==3.10.4",
    "pandas==2.3.3",
    "psycopg2-binary==2.9.13",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.0.1",
    "python-jose==3.4.0",
    "python-json-logger==3.3.0",
    "slowapi==0.1.10",
    "SQLAlchemy==2.0.40",
    "starlette==0.46.1",
    "toml==0.10.2",
    "typing-extensions==4.14.0",
    "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
    "autopep8==2.3.2",
    "black==24.10.0",
    "httpx==0.28.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-watch==4.2.0",
    "pytest==8.2.2",
    "virtualenv==20.26.2",
]

[tool.uv]
# An application, not a library: install the dependencies, not the project
package = false
